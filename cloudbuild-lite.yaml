steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/lite/Dockerfile.lite'
      - '-t'
      - 'europe-west2-docker.pkg.dev/gchat-gleanbot/cloud-run-source-deploy/vexa-lite:latest'
      - '.'
    timeout: '1800s'
    env:
      - 'DOCKER_BUILDKIT=1'

images:
  - 'europe-west2-docker.pkg.dev/gchat-gleanbot/cloud-run-source-deploy/vexa-lite:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
timeout: '2400s'
